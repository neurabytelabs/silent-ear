version: '3.8'

services:
  silent-ear:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: silent-ear
    ports:
      - "3000:3000"
    volumes:
      # Mount custom data directory (optional)
      - ./data:/app/data:ro
    environment:
      - RUST_LOG=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/status"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

# Usage:
# docker-compose up -d
# Open http://localhost:3000 in browser
# docker-compose logs -f silent-ear
# docker-compose down
