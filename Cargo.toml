[package]
name = "silent-ear"
version = "1.0.0"
edition = "2021"
authors = ["Mustafa Saraç <mrsarac@gmail.com>"]
description = "Industrial Edge AI Anomaly Detection System for Predictive Maintenance"
license = "MIT"
repository = "https://github.com/mrsarac/silent-ear"
keywords = ["predictive-maintenance", "edge-ai", "iiot", "anomaly-detection", "rust"]
categories = ["science", "simulation"]
readme = "README.md"

[dependencies]
csv = "1.3.0"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
ndarray = "0.15"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["cors", "fs"] }
chrono = "0.4"
