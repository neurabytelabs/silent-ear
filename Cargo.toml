[package]
name = "silent-ear"
version = "0.1.0"
edition = "2021"

[dependencies]
csv = "1.3.0"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
ndarray = "0.15"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["cors", "fs"] }
chrono = "0.4"
